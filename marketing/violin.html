<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Violín Chipao</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Archivo+Black&display=swap" rel="stylesheet">
<style>
:root{--navy:#001840;--gold:#D89000;--gold2:#F2B52E}
*{margin:0;padding:0;box-sizing:border-box}
body{background:transparent;font-family:Archivo,Arial,sans-serif}
.f{width:1080px;height:1920px;position:relative;overflow:hidden;color:#fff}
.logo{position:absolute;top:150px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:18px;padding:12px 34px 12px 14px;border-radius:999px;
 background:rgba(0,24,64,.88);border:4px solid var(--gold);box-shadow:0 8px 30px rgba(0,0,0,.35)}
.logo img{width:96px;height:96px;border-radius:50%}
.logo b{font-family:'Archivo Black';font-size:50px;line-height:.92;text-transform:uppercase;text-align:left}
.logo b i{font-style:normal;color:var(--gold2)}
.cap{position:absolute;left:50%;top:1380px;transform:translateX(-50%);white-space:nowrap;padding:18px 40px;border-radius:26px;
 background:rgba(0,24,64,.9);border:4px solid var(--gold);font-family:'Archivo Black';font-size:62px;line-height:1.1;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.cap em{font-style:normal;color:var(--gold2)}
.fin{position:absolute;left:50%;top:1520px;transform:translateX(-50%);text-align:center;padding:22px 50px;border-radius:30px;
 background:rgba(0,24,64,.92);border:4px solid var(--gold);box-shadow:0 8px 30px rgba(0,0,0,.4)}
.fin b{display:block;font-family:'Archivo Black';font-size:60px;color:var(--gold2);letter-spacing:.5px}
.fin span{display:block;font-size:36px;font-weight:700;margin-top:6px}
</style></head><body>
<div class="f" id="logo"><div class="logo"><img src="logo.png"><b>Chipao<br><i>Music</i></b></div></div>
<div class="f" id="c1"><div class="cap">Ahora puedo ser <em>romántico</em></div></div>
<div class="f" id="c2"><div class="cap">porque compré mi violín en</div></div>
<div class="f" id="c3"><div class="cap"><em>Chipao Music,</em></div></div>
<div class="f" id="c4"><div class="cap">la mejor tienda en <em>Perú.</em></div></div>
<div class="f" id="fin"><div class="fin"><b>chipaomusic.com</b><span>Envíos a todo el Perú</span></div></div>
</body></html>
