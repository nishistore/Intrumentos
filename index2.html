<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorteo de Navidad</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#111827,#1e293b);
    padding:20px;
}

.container{
    width:100%;
    max-width:500px;
    background:#111827;
    color:white;
    border-radius:30px;
    padding:35px;
    box-shadow:0 15px 40px rgba(0,0,0,.5);
}

h1{
    text-align:center;
    color:#4ade80;
    margin-bottom:10px;
}

p{
    text-align:center;
    color:#cbd5e1;
    margin-bottom:25px;
}

.review-btn{
    display:block;
    width:100%;
    text-align:center;
    background:#1f2937;
    color:white;
    text-decoration:none;
    padding:18px;
    border-radius:50px;
    font-size:18px;
    font-weight:bold;
    margin-bottom:25px;
    transition:all .3s ease;
}

.review-btn:hover{
    background:#4ade80;
    color:black;
    transform:translateX(8px);
    box-shadow:0 10px 25px rgba(74,222,128,.4);
}

label{
    display:block;
    margin-bottom:8px;
    margin-top:15px;
    font-weight:bold;
}

input{
    width:100%;
    padding:16px;
    background:#1f2937;
    border:none;
    border-radius:15px;
    color:white;
    font-size:15px;
}

input:focus{
    outline:none;
    box-shadow:0 0 0 3px rgba(74,222,128,.4);
}

.submit-btn{
    width:100%;
    padding:18px;
    margin-top:25px;
    border:none;
    border-radius:50px;
    background:#22c55e;
    color:black;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

.submit-btn:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 25px rgba(74,222,128,.4);
}

@media(max-width:600px){
    .container{
        padding:25px;
    }
}
</style>

</head>
<body>

<div class="container">

    <h1>🎄 Sorteo de Navidad 🎁</h1>

    <p>
        Participa en nuestro sorteo navideño y completa tus datos.
    </p>

   <a href="https://g.page/r/CTTeMiN_oeFTEBM/review"
   target="_blank"
   class="review-btn">
   ⭐ Dejar Reseña
</a>

    <form>

        <label>Nombre</label>
        <input type="text"
               placeholder="Ingresa tu nombre"
               required>

        <label>Apellido</label>
        <input type="text"
               placeholder="Ingresa tu apellido"
               required>

        <label>Número de celular</label>
        <input type="tel"
               placeholder="Ejemplo: 612345678"
               required>

        <button type="submit" class="submit-btn">
            Participar
        </button>

    </form>

</div>

</body>
</html>
