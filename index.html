<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Instrumentos Chipao | Tienda Virtual</title>
<meta name="description" content="Tienda virtual de Instrumentos Chipao: cuerda, teclados, percusión, viento, audio, colegio y accesorios.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy-deep:#050d1a;
  --navy-mid:#0c1f3a;
  --navy-card:#0e2545;
  --navy-line:#1c3c68;
  --navy-soft:#12305a;
  --gold:#d8ac5a;
  --gold-light:#f4dfae;
  --gold-dim:#9a7a3f;
  --cream:#f3ecdd;
  --ink:#cfd9e8;
  --muted:#7d8ba3;
  --ok:#8fbf7a;
  --err:#e0806f;
  --radius-lg:22px;
  --radius-md:14px;
  --radius-sm:10px;
  --header-h:64px;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;overflow-x:hidden;width:100%;}
body{
  font-family:'Poppins',sans-serif;
  background:var(--navy-deep);
  color:var(--cream);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  width:100%;
}
img,svg{display:block;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
ul{list-style:none;}
.h-serif{font-family:'Playfair Display',serif;}

/* ---------------- header ---------------- */
header.site{
  position:sticky;top:0;z-index:40;
  background:rgba(5,13,26,.92);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--navy-line);
}
.header-top{
  height:var(--header-h);
  display:flex;align-items:center;gap:14px;
  padding:0 18px;
  max-width:1280px;margin:0 auto;
}
.logo{
  font-family:'Playfair Display',serif;
  font-weight:800;font-size:22px;
  background:linear-gradient(180deg,var(--gold-light),var(--gold));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  white-space:nowrap;
  flex-shrink:0;
}
.logo span{display:block;font-family:'Poppins',sans-serif;font-size:9px;letter-spacing:.22em;color:var(--muted);font-weight:600;-webkit-text-fill-color:var(--muted);}
.icon-btn{
  width:40px;height:40px;border-radius:50%;
  border:1px solid var(--navy-line);background:var(--navy-card);
  display:flex;align-items:center;justify-content:center;
  color:var(--cream);flex-shrink:0;position:relative;
  transition:border-color .2s ease, transform .15s ease;
}
.icon-btn:hover{border-color:var(--gold);transform:translateY(-1px);}
.icon-btn svg{width:19px;height:19px;stroke:currentColor;}
.search-wrap{flex:1;position:relative;max-width:640px;}
.search-wrap input{
  width:100%;padding:11px 44px 11px 16px;
  background:var(--navy-card);border:1px solid var(--navy-line);
  border-radius:50px;color:var(--cream);font-size:14px;font-family:inherit;
  transition:border-color .2s ease, box-shadow .2s ease;
}
.search-wrap input::placeholder{color:var(--muted);}
.search-wrap input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(216,172,90,.15);}
.search-wrap button{
  position:absolute;right:5px;top:50%;transform:translateY(-50%);
  width:32px;height:32px;border-radius:50%;border:none;
  background:linear-gradient(135deg,var(--gold-light),var(--gold));
  display:flex;align-items:center;justify-content:center;
}
.search-wrap button svg{width:16px;height:16px;stroke:#1a1305;}
.cart-count{
  position:absolute;top:-3px;right:-3px;
  background:var(--gold);color:#1a1305;
  font-size:10px;font-weight:800;
  width:17px;height:17px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
}
.hide-mobile{display:none;}
.hide-desktop{display:flex;}

nav.catbar{
  border-top:1px solid var(--navy-line);
  overflow-x:auto;
  scrollbar-width:none;
}
nav.catbar::-webkit-scrollbar{display:none;}
.catbar-inner{
  display:flex;gap:6px;padding:10px 18px;
  max-width:1280px;margin:0 auto;
  white-space:nowrap;
}
.catbar-inner button{
  background:transparent;border:1px solid transparent;
  color:var(--ink);font-size:13px;font-weight:500;
  padding:7px 14px;border-radius:50px;
  transition:.2s ease;
}
.catbar-inner button:hover{border-color:var(--navy-line);color:var(--gold-light);}
.catbar-inner button.active{background:var(--gold);color:#1a1305;font-weight:700;}

/* ---------------- mobile drawer (menu) ---------------- */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;
  opacity:0;pointer-events:none;transition:opacity .25s ease;
}
.overlay.show{opacity:1;pointer-events:auto;}
.drawer{
  position:fixed;top:0;bottom:0;left:0;width:86%;max-width:340px;
  background:var(--navy-mid);border-right:1px solid var(--navy-line);
  z-index:61;transform:translateX(-105%);transition:transform .3s ease;
  overflow-y:auto;padding:20px 0 40px;
}
.drawer.show{transform:translateX(0);}
.drawer-head{display:flex;justify-content:space-between;align-items:center;padding:0 20px 16px;border-bottom:1px solid var(--navy-line);margin-bottom:8px;}
.drawer a.cat-link{display:block;padding:13px 20px;font-weight:600;font-size:14.5px;border-bottom:1px solid rgba(255,255,255,.04);}
.drawer a.cat-link:hover{background:rgba(216,172,90,.06);color:var(--gold-light);}
.drawer .sub-link{display:block;padding:9px 20px 9px 34px;font-size:13px;color:var(--ink);border-bottom:1px solid rgba(255,255,255,.03);}
.drawer .sub-link:hover{color:var(--gold-light);}

/* cart drawer */
.cart-drawer{
  position:fixed;top:0;bottom:0;right:0;width:92%;max-width:400px;
  background:var(--navy-mid);border-left:1px solid var(--navy-line);
  z-index:61;transform:translateX(105%);transition:transform .3s ease;
  display:flex;flex-direction:column;
}
.cart-drawer.show{transform:translateX(0);}
.cart-drawer .drawer-head{border-bottom:1px solid var(--navy-line);}
.cart-items{flex:1;overflow-y:auto;padding:10px 16px;}
.cart-item{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.05);}
.cart-item .thumb{width:56px;height:56px;border-radius:12px;background:var(--navy-card);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.cart-item .thumb svg{width:28px;height:28px;stroke:var(--gold);}
.cart-item .info{flex:1;min-width:0;}
.cart-item .name{font-size:13.5px;font-weight:600;margin-bottom:4px;}
.cart-item .price{font-size:13px;color:var(--gold-light);font-weight:700;}
.qty-ctrl{display:flex;align-items:center;gap:8px;margin-top:6px;}
.qty-ctrl button{width:24px;height:24px;border-radius:6px;border:1px solid var(--navy-line);background:var(--navy-card);color:var(--cream);font-size:14px;}
.qty-ctrl span{font-size:13px;min-width:16px;text-align:center;}
.remove-btn{color:var(--err);font-size:11.5px;font-weight:600;margin-top:6px;background:none;border:none;}
.cart-footer{padding:18px 20px 22px;border-top:1px solid var(--navy-line);}
.cart-subtotal{display:flex;justify-content:space-between;font-size:15px;font-weight:700;margin-bottom:14px;}
.cart-empty{padding:60px 20px;text-align:center;color:var(--muted);font-size:13.5px;}

/* ---------------- buttons ---------------- */
.btn-gold{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:linear-gradient(135deg,var(--gold-light),var(--gold) 60%,var(--gold-dim));
  color:#1a1305;font-weight:700;font-size:14.5px;
  padding:13px 22px;border:none;border-radius:50px;
  transition:transform .2s ease, box-shadow .2s ease;
}
.btn-gold:hover{transform:translateY(-2px);box-shadow:0 14px 26px -10px rgba(216,172,90,.55);}
.btn-outline{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:transparent;border:1.5px solid var(--gold);
  color:var(--gold-light);font-weight:600;font-size:14px;
  padding:12px 20px;border-radius:50px;
  transition:.2s ease;
}
.btn-outline:hover{background:var(--gold);color:#1a1305;}

/* ---------------- hero ---------------- */
.hero{
  position:relative;overflow:hidden;
  background:
    radial-gradient(ellipse 700px 420px at 20% -10%, rgba(216,172,90,.18), transparent 60%),
    radial-gradient(ellipse 600px 500px at 90% 100%, rgba(216,172,90,.10), transparent 60%),
    linear-gradient(160deg,var(--navy-deep),var(--navy-mid));
  padding:56px 20px 60px;
  text-align:center;
}
.hero .kicker{font-size:12px;letter-spacing:.3em;color:var(--gold-light);font-weight:600;text-transform:uppercase;opacity:.85;}
.hero h1{font-size:38px;line-height:1.15;margin:14px 0 14px;
  background:linear-gradient(180deg,var(--gold-light),var(--gold));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.hero p{color:var(--ink);max-width:46ch;margin:0 auto 26px;font-size:15px;line-height:1.6;}
.hero-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
.hero-badges{display:flex;gap:22px;justify-content:center;margin-top:34px;flex-wrap:wrap;color:var(--muted);font-size:12px;}
.hero-badges div{display:flex;align-items:center;gap:7px;}
.hero-badges svg{width:16px;height:16px;stroke:var(--gold);}

/* ---------------- section wrap ---------------- */
.wrap{max-width:1280px;margin:0 auto;padding:0 20px;}
.section-title{display:flex;align-items:baseline;justify-content:space-between;margin:52px 0 22px;}
.section-title h2{font-family:'Playfair Display',serif;font-size:26px;color:var(--gold-light);}
.section-title span{color:var(--muted);font-size:13px;}

/* category grid on home */
.cat-grid{
  display:grid;grid-template-columns:repeat(2,1fr);gap:14px;
  padding-bottom:50px;
}
.cat-card{
  position:relative;border-radius:var(--radius-md);
  background:linear-gradient(150deg,var(--navy-card),var(--navy-soft));
  border:1px solid var(--navy-line);
  padding:22px 16px;overflow:hidden;
  transition:transform .2s ease, border-color .2s ease;
  min-height:130px;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;
}
.cat-card:hover{transform:translateY(-3px);border-color:var(--gold);}
.cat-card svg{width:34px;height:34px;stroke:var(--gold);position:absolute;top:16px;left:16px;opacity:.9;}
.cat-card b{font-size:14.5px;position:relative;z-index:2;}
.cat-card small{color:var(--muted);font-size:11.5px;position:relative;z-index:2;}
.cat-card .glow{position:absolute;width:130px;height:130px;border-radius:50%;background:radial-gradient(circle,rgba(216,172,90,.18),transparent 70%);top:-40px;right:-40px;}

/* ---------------- shop layout ---------------- */
.shop-layout{display:flex;gap:26px;align-items:flex-start;padding-bottom:60px;}
.filters{
  width:250px;flex-shrink:0;position:sticky;top:calc(var(--header-h) + 60px);
  background:var(--navy-card);border:1px solid var(--navy-line);
  border-radius:var(--radius-md);padding:20px;
}
.filters h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--gold-light);margin-bottom:14px;}
.filter-group{margin-bottom:24px;}
.filter-group + .filter-group{border-top:1px solid var(--navy-line);padding-top:18px;}
.cat-accordion .cat-head{
  display:flex;justify-content:space-between;align-items:center;
  padding:9px 0;font-size:13.5px;font-weight:600;color:var(--cream);
}
.cat-accordion .cat-head svg{width:14px;height:14px;stroke:var(--muted);transition:transform .2s ease;}
.cat-accordion.open .cat-head svg{transform:rotate(180deg);}
.cat-accordion .subs{display:none;padding-left:6px;}
.cat-accordion.open .subs{display:block;}
.chk{display:flex;align-items:center;gap:9px;padding:6px 0;font-size:12.8px;color:var(--ink);cursor:pointer;}
.chk input{accent-color:var(--gold);width:14px;height:14px;}
.chk:hover{color:var(--gold-light);}
.price-inputs{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.price-inputs input{
  width:100%;padding:9px 10px;background:var(--navy-mid);border:1px solid var(--navy-line);
  border-radius:8px;color:var(--cream);font-size:12.5px;font-family:inherit;
}
.price-inputs input:focus{outline:none;border-color:var(--gold);}
input[type=range]{width:100%;accent-color:var(--gold);}
.clear-filters{width:100%;text-align:center;font-size:12.5px;color:var(--muted);background:none;border:1px dashed var(--navy-line);padding:9px;border-radius:8px;margin-top:6px;}
.clear-filters:hover{color:var(--gold-light);border-color:var(--gold);}

.shop-main{flex:1;min-width:0;}
.shop-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:10px;flex-wrap:wrap;}
.shop-toolbar .count{font-size:13px;color:var(--muted);}
.shop-toolbar select{
  background:var(--navy-card);border:1px solid var(--navy-line);color:var(--cream);
  padding:9px 12px;border-radius:8px;font-size:12.5px;font-family:inherit;
}
.filters-btn{display:none;align-items:center;gap:6px;background:var(--navy-card);border:1px solid var(--navy-line);color:var(--cream);padding:9px 14px;border-radius:8px;font-size:12.5px;}
.filters-btn svg{width:14px;height:14px;stroke:var(--gold);}

.product-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
.product-card{
  background:var(--navy-card);border:1px solid var(--navy-line);
  border-radius:var(--radius-md);overflow:hidden;
  display:flex;flex-direction:column;
  transition:transform .2s ease, border-color .2s ease;
}
.product-card:hover{transform:translateY(-4px);border-color:var(--gold);}
.product-photo{
  position:relative;aspect-ratio:1/1;
  background:radial-gradient(ellipse at 35% 30%, rgba(216,172,90,.16), transparent 65%), var(--navy-mid);
  display:flex;align-items:center;justify-content:center;
}
.product-photo svg{width:52%;height:52%;stroke:var(--gold);opacity:.92;}
.badge{
  position:absolute;top:10px;left:10px;
  background:var(--gold);color:#1a1305;font-size:10px;font-weight:800;
  padding:4px 9px;border-radius:50px;letter-spacing:.02em;
}
.badge.discount{background:var(--err);color:#fff;}
.wish-btn{
  position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;
  background:rgba(5,13,26,.55);border:1px solid var(--navy-line);
  display:flex;align-items:center;justify-content:center;
}
.wish-btn svg{width:15px;height:15px;stroke:var(--cream);}
.product-info{padding:13px 14px 15px;display:flex;flex-direction:column;gap:6px;flex:1;}
.product-cat{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);}
.product-name{font-size:13.5px;font-weight:600;line-height:1.35;min-height:36px;}
.product-price-row{display:flex;align-items:baseline;gap:8px;margin-top:2px;}
.product-price{font-size:16.5px;font-weight:800;color:var(--gold-light);}
.product-oldprice{font-size:12px;color:var(--muted);text-decoration:line-through;}
.add-btn{
  margin-top:8px;width:100%;padding:10px;border:1px solid var(--gold);border-radius:50px;
  background:transparent;color:var(--gold-light);font-size:12.8px;font-weight:700;
  transition:.2s ease;display:flex;align-items:center;justify-content:center;gap:6px;
}
.add-btn svg{width:14px;height:14px;stroke:currentColor;}
.add-btn:hover{background:var(--gold);color:#1a1305;}
.add-btn.added{background:var(--ok);border-color:var(--ok);color:#0a1a08;}

.empty-state{text-align:center;padding:70px 20px;color:var(--muted);}
.empty-state svg{width:44px;height:44px;stroke:var(--gold-dim);margin:0 auto 14px;}

/* ---------------- policy modal ---------------- */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:70;
  display:none;align-items:center;justify-content:center;padding:20px;
}
.modal-overlay.show{display:flex;}
.modal{
  background:var(--navy-mid);border:1px solid var(--navy-line);
  border-radius:var(--radius-lg);max-width:560px;width:100%;
  max-height:82vh;overflow-y:auto;padding:28px 26px;position:relative;
}
.modal-close{position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:50%;background:var(--navy-card);border:1px solid var(--navy-line);display:flex;align-items:center;justify-content:center;}
.modal-close svg{width:14px;height:14px;stroke:var(--cream);}
.modal h3{font-family:'Playfair Display',serif;color:var(--gold-light);font-size:21px;margin-bottom:14px;padding-right:30px;}
.modal p, .modal li{font-size:13.3px;line-height:1.7;color:var(--ink);margin-bottom:10px;}
.modal ul{padding-left:18px;list-style:disc;}
.modal h4{font-size:13px;color:var(--gold-light);margin:14px 0 6px;}

/* toast */
.toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--navy-card);border:1px solid var(--gold);color:var(--cream);
  padding:13px 22px;border-radius:50px;font-size:13px;font-weight:600;
  z-index:80;opacity:0;pointer-events:none;transition:.3s ease;
  display:flex;align-items:center;gap:8px;box-shadow:0 12px 30px rgba(0,0,0,.4);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast svg{width:16px;height:16px;stroke:var(--ok);}

/* ---------------- footer ---------------- */
footer.site{background:var(--navy-mid);border-top:1px solid var(--navy-line);margin-top:40px;}
.footer-grid{display:grid;grid-template-columns:1fr;gap:30px;padding:44px 20px;max-width:1280px;margin:0 auto;}
.footer-col h4{font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--gold-light);margin-bottom:14px;}
.footer-col button.link, .footer-col a{
  display:block;background:none;border:none;text-align:left;
  color:var(--muted);font-size:13px;padding:6px 0;transition:.2s ease;
}
.footer-col button.link:hover, .footer-col a:hover{color:var(--gold-light);}
.footer-brand p{color:var(--muted);font-size:12.8px;line-height:1.7;margin-top:10px;max-width:36ch;}
.footer-bottom{
  border-top:1px solid var(--navy-line);padding:18px 20px;
  text-align:center;color:var(--muted);font-size:11.5px;
}

@media (min-width:640px){
  .cat-grid{grid-template-columns:repeat(3,1fr);}
}
@media (min-width:900px){
  .hide-mobile{display:flex;}
  .hide-desktop{display:none;}
  .header-top{padding:0 32px;}
  .hero{padding:80px 20px 76px;}
  .hero h1{font-size:50px;}
  .cat-grid{grid-template-columns:repeat(4,1fr);}
  .footer-grid{grid-template-columns:1.4fr 1fr 1fr 1fr;}
}
@media (max-width:899px){
  .hide-desktop{display:flex;}
  .filters{
    position:fixed;top:0;bottom:0;left:0;width:86%;max-width:340px;z-index:61;
    border-radius:0;transform:translateX(-105%);transition:transform .3s ease;
    overflow-y:auto;
  }
  .filters.show{transform:translateX(0);}
  .filters-btn{display:flex;}
  .product-grid{grid-template-columns:repeat(2,1fr);}
}
@media (max-width:520px){
  .hero h1{font-size:30px;}
  .product-name{min-height:auto;}
}
</style>
</head>
<body>

<!-- ============ HEADER ============ -->
<header class="site">
  <div class="header-top">
    <button class="icon-btn hide-desktop" id="menuBtn" aria-label="Abrir menú">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <a href="#" class="logo" onclick="goHome();return false;">Chipao<span>Instrumentos Musicales</span></a>
    <div class="search-wrap hide-mobile">
      <input id="searchInput" type="text" placeholder="Buscar instrumentos, marcas, accesorios..." onkeydown="if(event.key==='Enter')doSearch();">
      <button aria-label="Buscar" onclick="doSearch()"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></button>
    </div>
    <button class="icon-btn hide-desktop" aria-label="Buscar" onclick="toggleMobileSearch()">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    </button>
    <button class="icon-btn" id="cartBtn" aria-label="Carrito" onclick="toggleCart(true)">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>
      <span class="cart-count" id="cartCount" style="display:none;">0</span>
    </button>
  </div>
  <div id="mobileSearchBar" class="hide-desktop" style="display:none;padding:0 16px 12px;">
    <div class="search-wrap">
      <input type="text" id="searchInputMobile" placeholder="Buscar instrumentos..." onkeydown="if(event.key==='Enter')doSearch(true);">

const PRODUCTS = [

const PRICE_MAX = Math.max(...PRODUCTS.map(p=>p.price));

/* ======================================================================
   ICONS (family-level line art, consistent brand style)
   ====================================================================== */
const ICONS = {

  school:'<path d="M12 3l9 4.5-9 4.5-9-4.5L12 3z"/><path d="M6 10.5V16c0 1.5 3 3 6 3s6-1.5 6-3v-5.5"/>',
  accessory:'<path d="M12 3c4 0 6 4 6 7.5S14 21 12 21s-6-4.5-6-10.5S8 3 12 3z"/><circle cx="12" cy="9" r="1.4" fill="currentColor"/>'
};
function iconSvg(type, extra){
  return '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" '+(extra||'')+'>'+(ICONS[type]||ICONS.accessory)+'</svg>';
}
const chevron='<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';

/* ======================================================================
   STATE (in-memory only — no localStorage/sessionStorage per platform rules)
   ====================================================================== */
const state = {
  view:'home',
  activeCat:null,
  activeSubs:new Set(),
  priceMin:0,
  priceMax:PRICE_MAX,
  sort:'relevancia',
  search:'',
  cart:[] // {id, qty}
};

const fmt = n => 'S/ ' + n.toLocaleString('es-PE',{minimumFractionDigits:0});

/* ======================================================================
   NAV BUILD (catbar, drawer, footer)
   ====================================================================== */
function buildNavLists(){
  document.getElementById('catbarInner').innerHTML = CATEGORIES.map(c=>
    `<button class="${state.view==='shop'&&state.activeCat===c.key?'active':''}" onclick="goShop('${c.key}')">${c.label}</button>`
  ).join('') + `<button class="${state.view==='shop'&&!state.activeCat?'active':''}" onclick="goShop(null)">Todos</button>`;

  document.getElementById('drawerCats').innerHTML = CATEGORIES.map(c=>
    `<a class="cat-link" href="#" onclick="toggleMenu(false);goShop('${c.key}');return false;">${c.label}</a>` +
    c.subs.map(s=>`<a class="sub-link" href="#" onclick="toggleMenu(false);goShop('${c.key}','${s.key}');return false;">${s.label}</a>`).join('')
  ).join('');

  document.getElementById('footerCats').innerHTML = CATEGORIES.map(c=>
    `<button class="link" onclick="goShop('${c.key}')">${c.label}</button>`
  ).join('');
}

/* ======================================================================
   ROUTING
   ====================================================================== */
function goHome(){
  state.view='home';
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}
function goShop(catKey, subKey){
  state.view='shop';
  state.activeCat = catKey || null;
  state.activeSubs = new Set(subKey?[subKey]:[]);
  state.priceMin=0; state.priceMax=PRICE_MAX; state.search='';
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}
function doSearch(mobile){
  const val = document.getElementById(mobile?'searchInputMobile':'searchInput').value.trim();
  state.view='shop'; state.activeCat=null; state.activeSubs=new Set(); state.search=val;
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}
function toggleMobileSearch(){
  const el=document.getElementById('mobileSearchBar');
  el.style.display = el.style.display==='none' ? 'block' : 'none';
}

/* ======================================================================
   RENDER: HOME
   ====================================================================== */
function renderHome(){
  return `
  <section class="hero">
    <div class="kicker">Instrumentos Musicales</div>
    <h1 class="h-serif">Tu música empieza aquí</h1>
    <p>Guitarras, teclados, percusión, viento, audio y todo lo necesario para el colegio. Calidad para principiantes y profesionales, con envíos a todo el país.</p>
    <div class="hero-actions">
      <button class="btn-gold" onclick="goShop(null)">Ver catálogo completo</button>
      <button class="btn-outline" onclick="goShop('colegio')">Kits para colegio</button>
    </div>
    <div class="hero-badges">
      <div>${iconSvg('accessory','style="width:16px;height:16px"')}Envíos a todo el Perú</div>
      <div>${iconSvg('accessory','style="width:16px;height:16px"')}Cuotas sin intereses</div>
      <div>${iconSvg('accessory','style="width:16px;height:16px"')}Garantía en todos los productos</div>
    </div>
  </section>

  <div class="wrap">
    <div class="section-title"><h2 class="h-serif">Busca por categoría</h2><span>${CATEGORIES.length} categorías</span></div>
    <div class="cat-grid">
      ${CATEGORIES.map(c=>`
        <button class="cat-card" onclick="goShop('${c.key}')" style="text-align:left;">
          <div class="glow"></div>
          ${iconSvg(c.icon)}
          <b>${c.label}</b>
          <small>${c.subs.length} línea${c.subs.length>1?'s':''}</small>
        </button>`).join('')}
    </div>

    <div class="section-title"><h2 class="h-serif">Destacados</h2><span>Selección de la casa</span></div>
    <div class="product-grid" style="margin-bottom:60px;">
      ${PRODUCTS.filter(p=>p.badge).slice(0,6).map(productCard).join('')}
    </div>
  </div>`;
}

/* ======================================================================
   RENDER: PRODUCT CARD
   ====================================================================== */
function productCard(p){
  const catObj = CATEGORIES.find(c=>c.key===p.cat);
  const subLabel = catObj ? (catObj.subs.find(s=>s.key===p.sub)||{}).label : '';
  return `
  <div class="product-card">
    <div class="product-photo">
      ${p.badge?`<span class="badge">${p.badge}</span>`:''}
      ${p.old?`<span class="badge discount" style="${p.badge?'top:38px;':''}">-${Math.round((1-p.price/p.old)*100)}%</span>`:''}
      <button class="wish-btn" aria-label="Favorito" onclick="event.stopPropagation();showToast('Guardado en favoritos')">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
      </button>
      ${iconSvg(p.icon)}
    </div>
    <div class="product-info">
      <div class="product-cat">${subLabel}</div>
      <div class="product-name">${p.name}</div>
      <div class="product-price-row">
        <span class="product-price">${fmt(p.price)}</span>
        ${p.old?`<span class="product-oldprice">${fmt(p.old)}</span>`:''}
      </div>
      <button class="add-btn" onclick="addToCart(${p.id}, this)">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>
        Agregar al carrito
      </button>
    </div>
  </div>`;
}

/* ======================================================================
   RENDER: SHOP (filters + grid)
   ====================================================================== */
function getFilteredProducts(){
  return PRODUCTS.filter(p=>{
    if(state.activeCat && p.cat!==state.activeCat) return false;
    if(state.activeSubs.size && !state.activeSubs.has(p.sub)) return false;
    if(p.price < state.priceMin || p.price > state.priceMax) return false;
    if(state.search && !p.name.toLowerCase().includes(state.search.toLowerCase())) return false;
    return true;
  }).sort((a,b)=>{
    if(state.sort==='price-asc') return a.price-b.price;
    if(state.sort==='price-desc') return b.price-a.price;
    return 0;
  });
}

function renderFiltersPanel(){
  return `
    <div class="filters" id="filtersPanel">
      <h3>Filtrar por categoría</h3>
      <div class="filter-group">
        ${CATEGORIES.map(c=>`
          <div class="cat-accordion ${state.activeCat===c.key?'open':''}" data-cat="${c.key}">
            <div class="cat-head" onclick="accordionToggle('${c.key}')">
              <label class="chk" style="padding:0;" onclick="event.stopPropagation()">
                <input type="checkbox" ${state.activeCat===c.key?'checked':''} onchange="setCat('${c.key}', this.checked)">
                ${c.label}
              </label>
              ${chevron}
            </div>
            <div class="subs">
              ${c.subs.map(s=>`
                <label class="chk">
                  <input type="checkbox" ${state.activeSubs.has(s.key)?'checked':''} onchange="toggleSub('${c.key}','${s.key}', this.checked)">
                  ${s.label}
                </label>`).join('')}
            </div>
          </div>`).join('')}
      </div>
      <div class="filter-group">
        <h3>Rango de precios</h3>
        <div class="price-inputs">
          <input type="number" min="0" max="${PRICE_MAX}" value="${state.priceMin}" onchange="setPriceMin(this.value)" placeholder="Mín">
          <span style="color:var(--muted)">—</span>
          <input type="number" min="0" max="${PRICE_MAX}" value="${state.priceMax}" onchange="setPriceMax(this.value)" placeholder="Máx">
        </div>
        <input type="range" min="0" max="${PRICE_MAX}" value="${state.priceMax}" oninput="setPriceMax(this.value)">
        <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px;">
          <span>S/ 0</span><span>S/ ${PRICE_MAX}</span>
        </div>
      </div>
      <button class="clear-filters" onclick="clearFilters()">Limpiar filtros</button>
    </div>`;
}

function renderShop(){
  const list = getFilteredProducts();
  const catObj = CATEGORIES.find(c=>c.key===state.activeCat);
  const title = state.search ? `Resultados para "${state.search}"` : (catObj ? catObj.label : 'Todos los productos');
  return `
  <div class="wrap">
    <div class="section-title" style="margin-top:26px;">
      <h2 class="h-serif">${title}</h2>
    </div>
    <div class="shop-layout">
      ${renderFiltersPanel()}
      <div class="shop-main">
        <div class="shop-toolbar">
          <button class="filters-btn" onclick="toggleFiltersPanel(true)">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
            Filtros
          </button>
          <span class="count">${list.length} producto${list.length!==1?'s':''}</span>
          <select onchange="setSort(this.value)">
            <option value="relevancia" ${state.sort==='relevancia'?'selected':''}>Relevancia</option>
            <option value="price-asc" ${state.sort==='price-asc'?'selected':''}>Precio: menor a mayor</option>
            <option value="price-desc" ${state.sort==='price-desc'?'selected':''}>Precio: mayor a menor</option>
          </select>
        </div>
        ${list.length ? `<div class="product-grid">${list.map(productCard).join('')}</div>` : `
          <div class="empty-state">
            ${iconSvg('accessory')}
            <p>No encontramos productos con esos filtros.</p>
            <button class="btn-outline" style="margin-top:14px;" onclick="clearFilters()">Limpiar filtros</button>
          </div>`}
      </div>
    </div>
  </div>
  <div class="overlay" id="filtersOverlay" onclick="toggleFiltersPanel(false)"></div>
  `;
}

/* ======================================================================
   FILTER ACTIONS
   ====================================================================== */
function accordionToggle(catKey){
  const el = document.querySelector(`.cat-accordion[data-cat="${catKey}"]`);
  el.classList.toggle('open');
}
function setCat(catKey, checked){
  state.activeCat = checked ? catKey : null;
  if(!checked) state.activeSubs = new Set();
  render();
}
function toggleSub(catKey, subKey, checked){
  state.activeCat = catKey;
  if(checked) state.activeSubs.add(subKey); else state.activeSubs.delete(subKey);
  render();
}
function setPriceMin(v){ state.priceMin = Math.max(0, Number(v)||0); render(); }
function setPriceMax(v){ state.priceMax = Math.min(PRICE_MAX, Number(v)||PRICE_MAX); render(); }
function setSort(v){ state.sort=v; render(); }
function clearFilters(){
  state.activeCat=null; state.activeSubs=new Set();
  state.priceMin=0; state.priceMax=PRICE_MAX; state.search='';
  render();
}
function toggleFiltersPanel(show){
  document.getElementById('filtersPanel')?.classList.toggle('show', show);
  document.getElementById('filtersOverlay')?.classList.toggle('show', show);
}

/* ======================================================================
   CART
   ====================================================================== */
function addToCart(id, btnEl){
  const existing = state.cart.find(c=>c.id===id);
  if(existing) existing.qty++; else state.cart.push({id, qty:1});
  updateCartCount();
  showToast('Producto agregado al carrito');
  if(btnEl){
    btnEl.classList.add('added');
    const original = btnEl.innerHTML;
    btnEl.innerHTML = '✓ Agregado';
    setTimeout(()=>{btnEl.classList.remove('added'); btnEl.innerHTML = original;}, 1200);
  }
}
function changeQty(id, delta){
  const item = state.cart.find(c=>c.id===id);
  if(!item) return;
  item.qty += delta;
  if(item.qty<=0) state.cart = state.cart.filter(c=>c.id!==id);
  updateCartCount();
  renderCartDrawer();
}
function removeFromCart(id){
  state.cart = state.cart.filter(c=>c.id!==id);
  updateCartCount();
  renderCartDrawer();
}
function updateCartCount(){
  const total = state.cart.reduce((s,c)=>s+c.qty,0);
  const el = document.getElementById('cartCount');
  el.textContent = total;
  el.style.display = total>0 ? 'flex':'none';
}
function renderCartDrawer(){
  const wrap = document.getElementById('cartItemsWrap');
  const footer = document.getElementById('cartFooter');
  if(!state.cart.length){
    wrap.innerHTML = `<div class="cart-empty">${iconSvg('accessory')}<p style="margin-top:12px;">Tu carrito está vacío</p></div>`;
    footer.innerHTML = `<button class="btn-outline" style="width:100%;" onclick="toggleCart(false)">Seguir comprando</button>`;
    return;
  }
  let subtotal = 0;
  wrap.innerHTML = state.cart.map(c=>{
    const p = PRODUCTS.find(x=>x.id===c.id);
    subtotal += p.price*c.qty;
    return `
    <div class="cart-item">
      <div class="thumb">${iconSvg(p.icon)}</div>
      <div class="info">
        <div class="name">${p.name}</div>
        <div class="price">${fmt(p.price)}</div>
        <div class="qty-ctrl">
          <button onclick="changeQty(${p.id},-1)">−</button>
          <span>${c.qty}</span>
          <button onclick="changeQty(${p.id},1)">+</button>
        </div>
        <button class="remove-btn" onclick="removeFromCart(${p.id})">Eliminar</button>
      </div>
    </div>`;
  }).join('');
  footer.innerHTML = `
    <div class="cart-subtotal"><span>Subtotal</span><span>${fmt(subtotal)}</span></div>
    <button class="btn-gold" style="width:100%;margin-bottom:10px;" onclick="checkoutDemo()">Ir a pagar</button>
    <button class="btn-outline" style="width:100%;" onclick="toggleCart(false)">Seguir comprando</button>
  `;
}
function checkoutDemo(){
  showToast('Checkout de ejemplo — conecta tu pasarela de pago aquí');
}
function toggleCart(show){
  document.getElementById('cartDrawer').classList.toggle('show', show);
  document.getElementById('cartOverlay').classList.toggle('show', show);
  if(show) renderCartDrawer();
}
function toggleMenu(show){
  document.getElementById('menuDrawer').classList.toggle('show', show);
  document.getElementById('menuOverlay').classList.toggle('show', show);
}
document.getElementById('menuBtn').addEventListener('click', ()=>toggleMenu(true));

/* ======================================================================
   TOAST
   ====================================================================== */
let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2400);
}
