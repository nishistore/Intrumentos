<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorteo de Navidad | Instrumentos Chipao</title>
<meta name="description" content="Deja tu reseña en Google y participa en el sorteo de Navidad de Instrumentos Chipao.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-deep:#050d1a;
    --navy-mid:#0c1f3a;
    --navy-card:#0e2545;
    --navy-line:#1c3c68;
    --gold:#d8ac5a;
    --gold-light:#f4dfae;
    --gold-dim:#9a7a3f;
    --cream:#f3ecdd;
    --ink:#cfd9e8;
    --ok:#8fbf7a;
    --err:#e0806f;
    --radius-lg:28px;
    --radius-md:16px;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html{ color-scheme: dark; }

  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:32px 18px;
    font-family:'Poppins', sans-serif;
    color:var(--cream);
    background:
      radial-gradient(ellipse 700px 420px at 50% -8%, rgba(216,172,90,.16), transparent 60%),
      radial-gradient(ellipse 600px 500px at 85% 90%, rgba(216,172,90,.08), transparent 60%),
      linear-gradient(160deg, var(--navy-deep), var(--navy-mid) 55%, var(--navy-deep));
    overflow-x:hidden;
    position:relative;
  }

  /* ---------- ambient snow (signature motion, subtle) ---------- */
  .snow{
    position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:0;
  }
  .snow span{
    position:absolute; top:-8%;
    display:block;
    width:var(--s,4px); height:var(--s,4px);
    border-radius:50%;
    background:var(--gold-light);
    opacity:var(--o,.5);
    filter:blur(.2px);
    animation:fall var(--d,14s) linear infinite;
    animation-delay:var(--delay,0s);
  }
  @keyframes fall{
    to{ transform:translateY(112vh) translateX(var(--drift,20px)); }
  }
  @media (prefers-reduced-motion: reduce){
    .snow{ display:none; }
  }

  /* ---------- card ---------- */
  .container{
    position:relative;
    z-index:1;
    width:100%;
    max-width:460px;
    background:linear-gradient(180deg, var(--navy-card), var(--navy-mid));
    border:1px solid var(--navy-line);
    border-radius:var(--radius-lg);
    padding:38px 32px 32px;
    box-shadow:
      0 30px 60px -20px rgba(0,0,0,.65),
      0 0 0 1px rgba(216,172,90,.06) inset;
  }

  .corner-frame{
    position:absolute; inset:10px;
    border:1px solid rgba(216,172,90,.35);
    border-radius:22px;
    pointer-events:none;
  }

  .brand{
    position:relative;
    text-align:center;
    margin-bottom:6px;
  }

  .brand img{
    width:150px;
    height:auto;
    display:block;
    margin:0 auto;
    filter:drop-shadow(0 6px 18px rgba(216,172,90,.25));
  }

  .kicker{
    display:block;
    text-align:center;
    font-size:11.5px;
    font-weight:600;
    letter-spacing:.28em;
    color:var(--gold-light);
    text-transform:uppercase;
    opacity:.85;
    margin-top:2px;
  }

  .divider{
    display:flex;
    align-items:center;
    gap:10px;
    margin:18px 0 20px;
  }
  .divider::before,
  .divider::after{
    content:"";
    flex:1;
    height:1px;
    background:linear-gradient(90deg, transparent, var(--gold-dim), transparent);
  }
  .divider i{
    width:7px; height:7px;
    background:var(--gold);
    transform:rotate(45deg);
    display:block;
    box-shadow:0 0 8px rgba(216,172,90,.6);
  }

  h1{
    font-family:'Playfair Display', serif;
    text-align:center;
    font-size:32px;
    font-weight:700;
    line-height:1.15;
    background:linear-gradient(180deg, var(--gold-light), var(--gold));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    margin-bottom:10px;
  }

  p.lead{
    text-align:center;
    color:var(--ink);
    font-size:14.5px;
    line-height:1.55;
    max-width:34ch;
    margin:0 auto 26px;
  }

  /* ---------- review button ---------- */
  .review-btn{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    width:100%;
    text-align:center;
    background:transparent;
    border:1.5px solid var(--gold);
    color:var(--gold-light);
    text-decoration:none;
    padding:16px 18px;
    border-radius:50px;
    font-size:15.5px;
    font-weight:600;
    letter-spacing:.01em;
    margin-bottom:28px;
    transition:transform .25s ease, box-shadow .25s ease, background .25s ease, color .25s ease;
  }
  .review-btn svg{ width:18px; height:18px; flex-shrink:0; }
  .review-btn:hover,
  .review-btn:focus-visible{
    background:linear-gradient(135deg, var(--gold-light), var(--gold));
    color:#1a1305;
    transform:translateY(-2px);
    box-shadow:0 14px 28px -10px rgba(216,172,90,.55);
  }

  form{ display:flex; flex-direction:column; gap:16px; }

  .field{ position:relative; }

  label{
    display:block;
    margin-bottom:7px;
    font-size:12.5px;
    font-weight:600;
    letter-spacing:.03em;
    color:var(--gold-light);
    text-transform:uppercase;
  }

  input{
    width:100%;
    padding:14px 16px;
    background:rgba(255,255,255,.03);
    border:1px solid var(--navy-line);
    border-radius:var(--radius-md);
    color:var(--cream);
    font-family:'Poppins', sans-serif;
    font-size:15px;
    transition:border-color .2s ease, box-shadow .2s ease, background .2s ease;
  }
  input::placeholder{ color:#7d8ba3; }
  input:hover{ border-color:#2a4d80; }
  input:focus{
    outline:none;
    border-color:var(--gold);
    background:rgba(216,172,90,.05);
    box-shadow:0 0 0 3px rgba(216,172,90,.18);
  }
  input:invalid:not(:placeholder-shown){
    border-color:var(--err);
  }

  .submit-btn{
    width:100%;
    padding:16px;
    margin-top:8px;
    border:none;
    border-radius:50px;
    background:linear-gradient(135deg, var(--gold-light), var(--gold) 60%, var(--gold-dim));
    color:#1a1305;
    font-family:'Poppins', sans-serif;
    font-size:16px;
    font-weight:700;
    letter-spacing:.01em;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    transition:transform .2s ease, box-shadow .2s ease, opacity .2s ease;
  }
  .submit-btn:hover:not(:disabled){
    transform:translateY(-2px);
    box-shadow:0 16px 30px -12px rgba(216,172,90,.6);
  }
  .submit-btn:active:not(:disabled){ transform:translateY(0); }
  .submit-btn:disabled{ opacity:.65; cursor:not-allowed; }

  .spinner{
    width:16px; height:16px;
    border:2px solid rgba(26,19,5,.35);
    border-top-color:#1a1305;
    border-radius:50%;
    animation:spin .7s linear infinite;
    display:none;
  }
  .submit-btn.loading .spinner{ display:inline-block; }
  .submit-btn.loading .btn-label{ display:none; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .mensaje{
    margin-top:16px;
    text-align:center;
    font-size:14px;
    font-weight:600;
    min-height:20px;
    opacity:0;
    transform:translateY(4px);
    transition:opacity .3s ease, transform .3s ease;
  }
  .mensaje.show{ opacity:1; transform:translateY(0); }
  .mensaje.ok{ color:var(--ok); }
  .mensaje.err{ color:var(--err); }

  footer{
    text-align:center;
    margin-top:26px;
    font-size:11.5px;
    color:#5c6c88;
    letter-spacing:.03em;
  }

  @media (max-width:380px){
    .container{ padding:30px 22px 26px; }
    h1{ font-size:27px; }
  }
</style>
</head>

      <input id="apellido" type="text" placeholder="Ingresa tu apellido" autocomplete="family-name" required>
    </div>
    <div class="field">
      <label for="celular">Número de celular</label>
      <input id="celular" type="tel" inputmode="numeric" placeholder="Ejemplo: 612345678"
             pattern="[0-9]{7,9}" maxlength="9" autocomplete="tel" required>
    </div>
    <button type="submit" class="submit-btn" id="submitBtn">
      <span class="btn-label">Participar</span>
      <span class="spinner" aria-hidden="true"></span>
    </button>
  </form>

  <div id="mensaje" class="mensaje" role="status" aria-live="polite"></div>

  <footer>🎄 Instrumentos Chipao &middot; Sorteo válido en diciembre</footer>
</div>

<script>
(function(){
  // gentle snow — a handful of soft gold particles, generated once
  var snowEl = document.querySelector('.snow');
  var COUNT = 14;
  for (var i = 0; i < COUNT; i++){
    var s = document.createElement('span');
    var size = (Math.random() * 3 + 2).toFixed(1);
    s.style.setProperty('--s', size + 'px');
    s.style.setProperty('--o', (Math.random() * .4 + .25).toFixed(2));
    s.style.setProperty('--d', (Math.random() * 10 + 12).toFixed(1) + 's');
    s.style.setProperty('--delay', (Math.random() * -20).toFixed(1) + 's');
    s.style.setProperty('--drift', (Math.random() * 60 - 30).toFixed(0) + 'px');
    s.style.left = (Math.random() * 100).toFixed(1) + '%';
    snowEl.appendChild(s);
  }
})();

const FORM_URL = "https://script.google.com/macros/s/AKfycbyVSF5Vf-RHeoUzWuHOUdBS_FXhzNwsVE8Q9aNKVEwVCYlVoOIh4j0RA-dy2cd8MAVstg/exec";

const form = document.getElementById("registro");
const submitBtn = document.getElementById("submitBtn");
const mensaje = document.getElementById("mensaje");
const celularInput = document.getElementById("celular");

celularInput.addEventListener("input", () => {
  celularInput.value = celularInput.value.replace(/\D/g, "").slice(0, 9);
});

function showMessage(text, type){
  mensaje.textContent = text;
  mensaje.className = "mensaje show " + type;
}

form.addEventListener("submit", async function(e){
  e.preventDefault();

  if (!form.checkValidity()){
    form.reportValidity();
    return;
  }

  const datos = {
    nombre: document.getElementById("nombre").value.trim(),
    apellido: document.getElementById("apellido").value.trim(),
    celular: celularInput.value.trim()
  };

  submitBtn.classList.add("loading");
  submitBtn.disabled = true;
  mensaje.className = "mensaje";

  try{
    const res = await fetch(FORM_URL, {
      method: "POST",
      body: JSON.stringify(datos)
    });

    if (!res.ok) throw new Error("Respuesta no válida del servidor");

    showMessage("✅ Registro realizado correctamente. ¡Mucha suerte!", "ok");
    form.reset();
  }catch(error){
    showMessage("❌ No se pudo guardar tu registro. Inténtalo de nuevo.", "err");
  }finally{
    submitBtn.classList.remove("loading");
    submitBtn.disabled = false;
  }
});
</script>

</body>
</html>
