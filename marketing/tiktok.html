<!doctype html><html lang="es"><head><meta charset="utf-8"><title>TikTok Chipao</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Archivo+Black&display=swap" rel="stylesheet">
<style>
:root{--navy:#001840;--ink:#000a1c;--gold:#D89000;--gold2:#F2B52E}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#222}
#t{width:1080px;height:1920px;position:relative;overflow:hidden;font-family:Archivo,Arial,sans-serif;color:#fff;text-align:center;
 background:radial-gradient(ellipse 90% 30% at 50% 0%,#0a2a63,var(--navy) 45%,var(--ink) 100%)}
.marca{position:absolute;top:170px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:22px}
.marca img{width:110px;height:110px;border-radius:50%}
.marca b{font-family:'Archivo Black';font-size:58px;letter-spacing:1px;text-transform:uppercase;line-height:.95;text-align:left}
.marca b i{font-style:normal;color:var(--gold2)}
.h{position:absolute;top:355px;left:0;right:0;font-family:'Archivo Black';font-size:80px;line-height:1.05;text-transform:uppercase;transform:rotate(-2deg)}
.h span{color:var(--gold2);display:block}
.sub{position:absolute;top:545px;left:0;right:0;font-size:34px;font-weight:700;color:#dfe6f5}
.sub b{color:var(--gold2)}
.barra{position:absolute;left:0;right:0;height:10px;background:var(--gold);box-shadow:0 0 30px rgba(216,144,0,.7)}
.pie{position:absolute;top:1700px;left:0;right:0;font-family:'Archivo Black';font-size:48px;color:var(--gold2);text-transform:uppercase}
.pie small{display:block;font-family:Archivo;font-weight:500;font-size:38px;color:#fff;text-transform:none;margin-top:8px}
</style></head><body>
<div id="t">
 <div class="marca"><img src="logo.png"><b>Chipao<br><i>Music</i></b></div>
 <div class="h">Hasta los robots<span>tocan guitarra</span></div>
 <div class="sub">Encuentra la tuya en <b>chipaomusic.com</b></div>
 <div class="barra" style="top:615px"></div><div class="barra" style="top:1695px;display:none"></div>
 <div class="barra" style="top:1695px"></div>
 <div class="pie">Envíos a todo el Perú<small>chipaomusic.com · WhatsApp 921 317 384</small></div>
</div></body></html>
